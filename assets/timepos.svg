<svg xmlns="http://www.w3.org/2000/svg" width="450" height="70" viewBox="0 0 450 70">
  <style>
    text {
      font-family: monospace;
      font-size: 14px;
      fill: #222;
    }
    .type {
      fill: #f00;
      text-anchor: middle;
    }
    .field {
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <!-- Types -->
  <text class="type" x="75"   y="20">uint32_t</text>
  <text class="type" x="225"   y="20">float</text>
  <text class="type" x="375"   y="20">float</text>

  <!-- Fields -->
  <rect x="0"  y="30" width="150" height="35" fill="#d8ead3" stroke="#000"/>
  <rect x="150" y="30" width="150" height="35" fill="#efe3d3" stroke="#000"/>
  <rect x="300" y="30" width="150" height="35" fill="#efe3d3" stroke="#000"/>

  <!-- Labels -->
  <text class="field" x="75"   y="47.5">timestamp</text>
  <text class="field" x="225"   y="47.5">position.x</text>
  <text class="field" x="375"   y="47.5">position.y</text>
</svg>

